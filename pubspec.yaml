name: hf_chat_flutter
description: Minimal Claude-style chat client for Hugging Face Router API.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter

  # HTTP client
  dio: any

  # Local database
  sqflite: any
  sqflite_common_ffi: any
  path: any
  path_provider: any

  # Secure Storage
  flutter_secure_storage: any

  # UUID for conversation/message IDs
  uuid: any

  # Markdown rendering for AI answers
  flutter_markdown: any

  # Syntax highlighting for code blocks
  flutter_highlight: any
  highlight: any

  # File picker for selecting project folders
  file_picker: any

  # Native drag-and-drop targets on desktop (Windows / macOS / Linux).
  # Used by the chat input so files dragged from the OS can be attached
  # to the next prompt.
  desktop_drop: any
  cross_file: any

  # Clipboard is built-in via services, no extra dep needed
  cupertino_icons: any

  # HTML parser for the Ollama library scrape (ollama.com/library has no
  # public JSON API — we extract model cards from the rendered HTML).
  html: any
  markdown: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: any

flutter:
  uses-material-design: true
